<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CampusPulse</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand text-primary" href="index.html">
        <i class="bi bi-mortarboard-fill"></i> CampusPulse
      </a>
      
      <div class="d-flex flex-wrap align-items-center gap-2">
        <a class="btn btn-outline-primary btn-sm" href="index.html">Home</a>
        <a class="btn btn-outline-primary btn-sm" href="events.html">Events</a>
        <a class="btn btn-outline-primary btn-sm" href="hackathons.html">Hackathons</a>
        <a class="btn btn-outline-primary btn-sm" href="clubs.html">Clubs</a>
        <a class="btn btn-outline-primary btn-sm" href="news.html">Tech News</a>
        <a class="btn btn-outline-primary btn-sm" href="about.html">About Creators</a>
        <a class="btn btn-success btn-sm fw-bold" href="register.html">Register</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">

    <!-- Form Box -->
    <div class="row justify-content-center">
      <div class="col-md-8">
        
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square"></i> Student Registration Form</h4>
            <small>Register for events, hackathons, or college clubs</small>
          </div>
          
          <div class="card-body p-4">
            
            <!-- Simple HTML form (method GET, no JavaScript) -->
            <form action="index.html" method="GET">
              
              <!-- Name & Roll No -->
              <div class="row mb-3">
                <div class="col-md-6 mb-2">
                  <label class="form-label fw-bold">Student Name:</label>
                  <input type="text" class="form-control" placeholder="Enter your full name" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">College Roll Number:</label>
                  <input type="text" class="form-control" placeholder="e.g. 22BCSE101" required>
                </div>
              </div>

              <!-- Branch & Email -->
              <div class="row mb-3">
                <div class="col-md-6 mb-2">
                  <label class="form-label fw-bold">Branch:</label>
                  <select class="form-select" required>
                    <option value="">-- Select Your Branch --</option>
                    <option value="CSE">Computer Science & Engineering (CSE)</option>
                    <option value="IT">Information Technology (IT)</option>
                    <option value="ECE">Electronics & Communication (ECE)</option>
                    <option value="AIDS">AI & Data Science (AI & DS)</option>
                    <option value="MECH">Mechanical Engineering (MECH)</option>
                    <option value="CIVIL">Civil Engineering (CIVIL)</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">College Email:</label>
                  <input type="email" class="form-control" placeholder="name@college.edu" required>
                </div>
              </div>

              <!-- Choose Event/Club -->
              <div class="mb-3">
                <label class="form-label fw-bold">Select Event / Hackathon / Club:</label>
                <select class="form-select" required>
                  <option value="">-- Choose what you want to register for --</option>
                  
                  <optgroup label="Campus Events">
                    <option value="robodrive">RoboDrive 2026 (Robotics Club - Nov 28)</option>
                    <option value="codecombat">FizzBuzz (Technical Club - Dec 02)</option>
                    <option value="esummit">E-Summit '26 (E-Cell - Dec 06)</option>
                    <option value="symphony">Pratishruti (Cultural Club - Dec 10)</option>
                    <option value="lenscanvas">Nautanki (Arts Club - Dec 18)</option>
                  </optgroup>
                  
                  <optgroup label="Hackathons">
                    <option value="hackcampus">Shrijana (Internal - Offline)</option>
                    <option value="globalai">Hackanova (External - Online)</option>
                    <option value="statetech">Smart India Hackathon (External - Offline)</option>
                    <option value="cybershield">Prajwalan (Internal - Online)</option>
                  </optgroup>
                  
                  <optgroup label="Club Membership">
                    <option value="join_robotics">Join Robotics Club</option>
                    <option value="join_coding">Join Technical Club</option>
                    <option value="join_ecell">Join E-Cell Startup Club</option>
                    <option value="join_cultural">Join Cultural Club</option>
                  </optgroup>
                </select>
              </div>

              <!-- Participation Mode -->
              <div class="mb-4">
                <label class="form-label fw-bold">Mode of Attendance:</label>
                <div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="mode" id="modeOffline" value="offline" checked>
                    <label class="form-check-label" for="modeOffline">Offline (In-Person on campus)</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="mode" id="modeOnline" value="online">
                    <label class="form-check-label" for="modeOnline">Online (Virtual)</label>
                  </div>
                </div>
              </div>

              <!-- Submit button -->
              <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-2">Submit Registration</button>
                <a href="index.html" class="text-decoration-none small">&larr; Back to Home</a>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="text-center">
    <div class="container">
      <p class="fw-bold text-white mb-2">CampusPulse - Campus Event & Club Management</p>
      <div class="mb-3">
        <a href="index.html">Home</a> |
        <a href="events.html">Events</a> |
        <a href="hackathons.html">Hackathons</a> |
        <a href="clubs.html">Clubs</a> |
        <a href="news.html">Tech News</a> |
        <a href="about.html">About Creators</a> |
        <a href="register.html">Register</a>
  </footer>

</body>
</html>
